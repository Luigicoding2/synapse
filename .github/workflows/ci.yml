name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-rust:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust Workspace Tests
        run: cargo test --workspace --verbose

      - name: Build Release Artifacts
        run: cargo build --release

  test-go:
    name: Go Tests (${{ matrix.os }})
    needs: test-rust
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Rust Release Libraries
        run: cargo build --release

      - name: Run Go Tests & Benchmarks (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ./bindings
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release
        run: |
          go test -v .
          go test -bench=. -benchmem .

      - name: Run Go Tests & Benchmarks (Windows)
        if: runner.os == 'Windows'
        working-directory: ./bindings
        run: |
          go test -v .
          go test -bench="." -benchmem .
